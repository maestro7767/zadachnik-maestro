.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 75%,#fff) 0%,var(--accent) 100%);color:#fff}
.hero .mini{color:rgba(255,255,255,.85)}

/* Визуальный слой: анимации и оформление */
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.head{background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 65%);transition:background .5s ease}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadeIn .4s ease both}
.empty::before{content:"\2726";font-size:26px;color:var(--accent)}
.tl{position:relative;padding-left:22px}

.tl>.task.done::after{opacity:.4}
.colors button.locked{opacity:.35;font-size:14px;display:flex;align-items:center;justify-content:center}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.sub-tabs::-webkit-scrollbar{display:none}
.sub-tabs .chip-btn{flex:0 0 auto;white-space:nowrap;padding:10px 18px;font-size:15px}

<div id="app"></div>
<script>
const __M1 = (() => {

                                                       
                                                 
                                                            
                                                   

/** Текущая версия формата сохранённых данных. Растёт при каждом изменении структуры. */
const SCHEMA_VERSION = 1;

                                                

/** Настройки и профиль пользователя. Необязательные поля появились в более поздних версиях. */
                          
               
              
                     
                 
               
                  
               
                    
                  
                                                                    
                      
                  
                                             
                     
 

                        
                
                
 

/** Данные одного аккаунта на устройстве. */
                           
               
                
                    
                   
                            
                    
 

/** Всё, что приложение хранит в localStorage. */
                          
                  
                                                                                 
                                
                                 
                         
 

function emptyAppData()          {
  return { version: SCHEMA_VERSION, users: {}, data: {}, session: null };
}

function emptyUserData()           {
  return { notes: { study: "", sport: "" }, plans: [] };
}

const CATEGORIES                      = ["study", "sport", "life"];

/** Проверяет, что значение похоже на план. Используется при загрузке, чтобы не сломать приложение испорченными данными. */
function isPlan(value         )                {
  if (typeof value !== "object" || value === null) return false;
  const p = value                           ;
  return (
    typeof p.id === "string" &&
    typeof p.text === "string" &&
    typeof p.date === "string" &&
    typeof p.time === "string" &&
    typeof p.done === "boolean" &&
    typeof p.cat === "string" &&
    (CATEGORIES                     ).includes(p.cat)
  );
}

return { SCHEMA_VERSION, emptyAppData, emptyUserData, isPlan };
})();
const __M2 = (() => {

                                                                  
                                                                         

                          
                      
                        
                                                                     
                                  
 

                             
                      
                             
                                
                                                         
                         
                        
 

                         
                      
                                          
                           
                         
                       
                           
 

                           
                      
                         
                       
 

                            
                      
                         
                        
                       
                       
 

/** Учебные данные аккаунта. Всё хранится на устройстве. */
                            
                                      
                      
                                                                
                     
                      
                            
                    
                        
                     
 

function emptyStudy()            {
  return {
    institution: null,
    secondYear: false,
    attendance: 0,
    subjects: [],
    assessments: [],
    lessons: [],
    deadlines: [],
    cards: [],
  };
}

return { emptyStudy };
})();
const __M3 = (() => {
const { SCHEMA_VERSION, emptyAppData, emptyUserData, isPlan } = __M1;
const { emptyStudy } = __M2;


/** Минимальный интерфейс хранилища. В браузере это localStorage, в тестах — объект в памяти. */
                                
                                      
                                            
 

/** Приводит данные любой версии к текущему формату и отбрасывает испорченные записи. */
function migrate(raw         )          {
  if (typeof raw !== "object" || raw === null) return emptyAppData();
  const src = raw                           ;

  const users                         = {};
  if (typeof src.users === "object" && src.users !== null) {
    for (const [login, hash] of Object.entries(src.users                           )) {
      if (typeof hash === "string") users[login] = hash;
    }
  }

  const data                           = {};
  if (typeof src.data === "object" && src.data !== null) {
    for (const [login, entry] of Object.entries(src.data                           )) {
      data[login] = sanitizeUser(entry);
    }
  }

  const session = typeof src.session === "string" && data[src.session] ? src.session : null;
  return { version: SCHEMA_VERSION, users, data, session };
}

function isHabit(v         )             {
  if (typeof v !== "object" || v === null) return false;
  const h = v                           ;
  return (
    typeof h.id === "string" &&
    typeof h.name === "string" &&
    Array.isArray(h.doneDays) &&
    h.doneDays.every((d) => typeof d === "string")
  );
}

function isWorkout(v         )                    {
  if (typeof v !== "object" || v === null) return false;
  const w = v                           ;
  return (
    typeof w.id === "string" &&
    typeof w.date === "string" &&
    typeof w.exerciseId === "string" &&
    Array.isArray(w.sets) &&
    w.sets.every((s) => {
      if (typeof s !== "object" || s === null) return false;
      const set = s                           ;
      return typeof set.weight === "number" && typeof set.reps === "number";
    })
  );
}

function sanitizeUser(entry         )           {
  const fallback = emptyUserData();
  if (typeof entry !== "object" || entry === null) return fallback;
  const e = entry                           ;
  const notes = typeof e.notes === "object" && e.notes !== null ? (e.notes                           ) : {};
  const plans = Array.isArray(e.plans) ? e.plans.filter(isPlan) : [];
  const habits = Array.isArray(e.habits) ? e.habits.filter(isHabit) : undefined;
  const workouts = Array.isArray(e.workouts) ? e.workouts.filter(isWorkout) : undefined;
  return {
    notes: {
      study: typeof notes.study === "string" ? notes.study : "",
      sport: typeof notes.sport === "string" ? notes.sport : "",
    },
    plans,
    ...(typeof e.profile === "object" && e.profile !== null ? { profile: e.profile                        } : {}),
    ...(habits ? { habits } : {}),
    ...(workouts ? { workouts } : {}),
    ...(typeof e.study === "object" && e.study !== null ? { study: { ...emptyStudy(), ...(e.study          ) }              } : {}),
  };
}

/** Читает данные из хранилища. Если данных нет или они испорчены, возвращает пустое состояние. */
function loadAppData(store               , key        )          {
  const text = store.getItem(key);
  if (text === null) return emptyAppData();
  try {
    return migrate(JSON.parse(text));
  } catch {
    return emptyAppData();
  }
}

/** Сохраняет данные. Возвращает false, если хранилище недоступно или переполнено. */
function saveAppData(store               , key        , data         )          {
  try {
    store.setItem(key, JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}

return { migrate, sanitizeUser, loadAppData, saveAppData };
})();
const __M4 = (() => {

/**
 * Работа с датами в локальном часовом поясе.
 * Все даты приложения — строки формата YYYY-MM-DD.
 * Неделя начинается с понедельника.
 */

const pad = (n        )         => String(n).padStart(2, "0");

/** Разбирает YYYY-MM-DD в локальную полночь. */
function parseYmd(s        )       {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y          , (m          ) - 1, d          );
}

/** Форматирует Date в YYYY-MM-DD (локальное время). */
function ymd(d      )         {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function parseWhen(src){
  const rx = p => new RegExp("(^|\\s)(" + p + ")(?=[\\s.,!?]|$)");
  const base = new Date(todayStr() + "T00:00");
  let s = " " + src.toLowerCase() + " ";
  let date = todayStr(), time = "", m, hadRel = false;
  const cut = mm => { s = s.replace(mm[0], " "); };
  if ((m = s.match(rx("послезавтра")))) { date = addDays(todayStr(), 2); hadRel = true; cut(m); }
  else if ((m = s.match(rx("завтра")))) { date = addDays(todayStr(), 1); hadRel = true; cut(m); }
  else if ((m = s.match(rx("сегодня")))) { hadRel = true; cut(m); }
  const WD = { воскресенье: 0, понедельник: 1, вторник: 2, среда: 3, среду: 3, четверг: 4, пятница: 5, пятницу: 5, суббота: 6, субботу: 6 };
  if (!hadRel && (m = s.match(rx("(?:в\\s+)?(?:следующ\\w*\\s+)?(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье)")))) {
    const target = WD[m[2].split(" ").pop()];
    let diff = (target - base.getDay() + 7) % 7;
    if (diff === 0) diff = 7;
    date = addDays(todayStr(), diff); cut(m);
  }
  const MON = { января: 0, февраля: 1, марта: 2, апреля: 3, мая: 4, июня: 5, июля: 6, августа: 7, сентября: 8, октября: 9, ноября: 10, декабря: 11 };
  let dd = null, mo = null;
  if ((m = s.match(rx("(\\d{1,2})\\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)")))) {
    const t = m[2].match(/(\d{1,2})\s+(\S+)/);
    dd = +t[1]; mo = MON[t[2]]; cut(m);
  } else if ((m = s.match(rx("(\\d{1,2})[./](\\d{1,2})")))) {
    const t = m[2].match(/(\d{1,2})[./](\d{1,2})/);
    dd = +t[1]; mo = +t[2] - 1; cut(m);
  }
  if (dd !== null && mo !== null) {
    const d = new Date(base.getFullYear(), mo, dd);
    if (d < base) d.setFullYear(base.getFullYear() + 1);
    date = ymd(d);
  }
  if ((m = s.match(rx("(?:в\\s+)?полдень")))) { time = "12:00"; cut(m); }
  else if ((m = s.match(rx("(?:в\\s+)?полночь")))) { time = "00:00"; cut(m); }
  else if ((m = s.match(rx("(?:в\\s+)?\\d{1,2}[:.]\\d{2}")))) {
    const t = m[2].match(/(\d{1,2})[:.](\d{2})/);
    time = pad(+t[1]) + ":" + t[2]; cut(m);
  } else if ((m = s.match(rx("(?:в\\s+)?\\d{1,2}\\s+(утра|вечера|дня|ночи)")))) {
    const t = m[2].match(/(\d{1,2})\s+(\S+)/);
    let h = +t[1];
    if ((t[2] === "вечера" || t[2] === "дня") && h < 12) h += 12;
    if ((t[2] === "утра" || t[2] === "ночи") && h === 12) h = 0;
    time = pad(h) + ":00"; cut(m);
  } else if ((m = s.match(rx("в\\s+\\d{1,2}")))) {
    time = pad(+m[2].match(/\d{1,2}/)[0]) + ":00"; cut(m);
  }
  let text = s.replace(/\s+/g, " ").trim().replace(/(^|\s)(в|на)$/, "").trim();
  text = text.charAt(0).toUpperCase() + text.slice(1);
  return { text, date, time };
}

function dayLabel(d){
  if (d === todayStr()) return "сегодня";
  if (d === addDays(todayStr(), 1)) return "завтра";
  const x = new Date(d + "T00:00");
  return pad(x.getDate()) + "." + pad(x.getMonth() + 1);
}

          <label>${isSchool ? "Оценка 2–5" : "Баллы"}<input name="value" type="number" step="0.5" min="${isSchool ? 2 : 0}" max="${isSchool ? 5 : 100}" value="${isSchool ? 5 : 10}"></label>
          <button class="btn" type="submit">Записать</button> ${cancel}</form>`
      : addBtn("asm", "+ Записать работу");
    body = `<div class="label">Оценки</div><div class="card">${subjectRows}</div>${subjectForm}${asmForm}${second}${att}`;
  } else if (sec === "schedule") {
    const lessonRows = sortedLessons.map((l) => `<div class="setrow"><span>${WD_NAMES[l.weekday - 1]} · ${esc(l.subject)}</span><span class="mini">${l.start}–${l.end}</span></div>`).join("") || `<div class="mini">Расписание пустое</div>`;
    const lesForm = form === "les"
      ? `<form id="les" class="card" autocomplete="off"><label>День<select name="wd">${WD_NAMES.map((n, i) => `<option value="${i + 1}">${n}</option>`).join("")}</select></label>
          <label>Предмет<input name="subject" required maxlength="40"></label>
          <div class="grid2"><label>Начало<input name="start" type="time" required value="09:00"></label><label>Конец<input name="end" type="time" required value="10:30"></label></div>
          <button class="btn" type="submit">Добавить занятие</button> ${cancel}</form>`
      : addBtn("les", "+ Добавить занятие");
    const dlForm = form === "dl"
      ? `<form id="dl" class="card" autocomplete="off"><label>Что сдать<input name="title" required maxlength="60"></label><label>Срок<input name="due" type="date" required value="${today}"></label><button class="btn" type="submit">Добавить срок</button> ${cancel}</form>`
      : addBtn("dl", "+ Добавить срок");
    body = `<div class="label">Занятия</div><div class="card">${lessonRows}</div>${lesForm}
      <div class="label">Дедлайны</div><div class="card">${deadlineRows(upcomingDeadlines(s.deadlines, today, 60))}</div>${dlForm}`;
  } else {
    const cardForm = form === "card"
      ? `<form id="card" class="card" autocomplete="off"><label>Вопрос<input name="front" required maxlength="120"></label><label>Ответ<input name="back" required maxlength="300"></label><button class="btn" type="submit">Добавить карточку</button> ${cancel}</form>`
      : addBtn("card", "+ Добавить карточку");
    body = `<div class="label">Помодоро</div>${pomoBlock}<div class="label">Карточки</div>${cardBlock}${cardForm}`;
  }

  return `<div class="wrap"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="chip" data-act="inst-reset">Сменить заведение</button></div>
    <div class="sub-tabs" style="margin:12px 0">${sectionBtn("today", "Сегодня")}${sectionBtn("grades", "Оценки")}${sectionBtn("schedule", "Расписание")}${sectionBtn("focus", "Фокус")}</div>
    ${msg}${body}</div>`;
}

function startPomoTicker(){
  if (pomoTicker) clearInterval(pomoTicker);
  pomoPhaseIndex = ui.pomoStart ? pomodoroAt(Math.floor((Date.now() - ui.pomoStart) / 1000)).index : -1;
  pomoTicker = setInterval(() => {
    if (!ui.pomoStart) {
      clearInterval(pomoTicker);
      pomoTicker = null;
      return;
    }
    const st = pomodoroAt(Math.floor((Date.now() - ui.pomoStart) / 1000));
    if (st.index !== pomoPhaseIndex) {
      pomoPhaseIndex = st.index;
      render();
      return;
    }
    const el = document.getElementById("pomoTxt");
    if (el) el.textContent = formatTime(st.remainingSec);
  }, 1000);
}

let restTicker = null;

function habitsOf(){
  const d = me();
  if (!d.habits) d.habits = starterHabits();
  return d.habits;
}

function exName(id){
  const e = DEFAULT_EXERCISES.find((x) => x.id === id);
  return e ? e.name : id;
}

function sportHTML(){
  const today = todayStr();
  const habits = habitsOf();
  const workouts = me().workouts || [];
  const selected = ui.exercise || DEFAULT_EXERCISES[0].id;
  const habitRows = habits.map((h) => {
    const done = h.doneDays.includes(today);
    return `<div class="setrow"><button class="check" data-act="habit" data-id="${h.id}" aria-pressed="${done}" style="${done ? "background:var(--green);border-color:var(--green);color:#fff" : ""}">${done ? "✓" : ""}</button><span class="grow">${esc(h.name)}</span><span class="mini">серия ${habitStreak(h.doneDays, today)}</span></div>`;
  }).join("");
  const options = DEFAULT_EXERCISES.map((e) => `<option value="${e.id}" ${e.id === selected ? "selected" : ""}>${esc(e.name)}</option>`).join("");
  const todaySets = workouts.filter((w) => w.date === today).map((w) => {
    const s = w.sets[0];
    return `<div class="setrow"><span>${esc(exName(w.exerciseId))}</span><span class="mini">${s ? s.weight + " кг × " + s.reps : ""}</span></div>`;
  }).join("") || `<div class="mini">Сегодня подходов пока нет</div>`;
  const prog = exerciseProgress(workouts, selected).slice(-6);
  const maxW = Math.max(1, ...prog.map((p) => p.maxWeight));
  const bars = prog.map((p) => `<div class="wcol"><div class="wbar"><i style="height:${Math.max(6, Math.round(p.maxWeight / maxW * 100))}%"></i></div><small>${p.date.slice(5)}</small></div>`).join("")
    || `<div class="mini">Пока нет подходов по этому упражнению</div>`;
  const rest = ui.rest
    ? `<div class="card" style="text-align:center"><div class="mini">Отдых</div><div id="restTxt" style="font-size:34px;font-weight:800">${formatTime(remainingSec(ui.rest, Date.now()))}</div><button class="chip" data-act="rest-skip">Пропустить отдых</button></div>`
    : "";
  return `
    <div class="label">Привычки</div><div class="card">${habitRows}</div>
    <div class="label">Тренировка</div>
    ${ui.workoutMsg ? `<div class="err">${esc(ui.workoutMsg)}</div>` : ""}
    <form id="wk" class="card" autocomplete="off">
      <label>Упражнение<select name="ex" data-ex>${options}</select></label>
      <div class="grid2">
        <label>Вес, кг<input name="weight" type="number" inputmode="decimal" min="0" max="500" step="0.5" value="0"></label>
        <label>Повторения<input name="reps" type="number" inputmode="numeric" min="1" max="100" step="1" value="8"></label>
      </div>
      <button class="btn" type="submit">Записать подход</button>
    </form>
    ${rest}
    <div class="label">Сегодня</div><div class="card">${todaySets}</div>
    <div class="label">Прогресс: ${esc(exName(selected))}</div>
    <div class="card"><div class="wchart" style="height:120px">${bars}</div></div>`;
}

function addSet(form){
  const set = { weight: Number(form.weight.value), reps: Number(form.reps.value) };
  if (!isValidSet(set)) {
    ui.workoutMsg = "Проверь вес (от 0 до 500 кг) и повторения (от 1 до 100)";
    return render();
  }
  const list = me().workouts || (me().workouts = []);
  list.push({ id: uid(), date: todayStr(), exerciseId: form.ex.value, sets: [set] });
  ui.exercise = form.ex.value;
  ui.workoutMsg = "";
  ui.rest = { startedAtMs: Date.now(), durationSec: 90 };
  save();
  startRestTicker();
  render();
}

function startRestTicker(){
  if (restTicker) clearInterval(restTicker);
  restTicker = setInterval(() => {
    if (!ui.rest) {
      clearInterval(restTicker);
      restTicker = null;
      return;
    }
    const left = remainingSec(ui.rest, Date.now());
    const el = document.getElementById("restTxt");
    if (el) el.textContent = formatTime(left);
    if (left === 0) {
      ui.rest = null;
      clearInterval(restTicker);
      restTicker = null;
      render();
    }
  }, 1000);
}

async function doAuth(f){
  const login = f.login.value.trim().toLowerCase(), pass = f.pass.value;
  if (!/^[a-z0-9_.\-]{3,20}$/.test(login)) { ui.err = "Логин: 3–20 символов, латиница, цифры, . _ -"; return render(); }
  if (pass.length < 6) { ui.err = "Пароль: минимум 6 символов"; return render(); }
  const h = await hash(login + ":" + pass);
  if (ui.mode === "reg") {
    if (db.users[login]) { ui.err = "Такой логин уже занят"; return render(); }
    db.users[login] = h; db.data[login] = { notes: { study: "", sport: "" }, plans: [] };
  } else if (db.users[login] !== h) { ui.err = "Неверный логин или пароль"; return render(); }
  db.session = login; ui.err = ""; ui.tab = "today"; save(); render();
}

async function changePassword(f){
  const login = db.session;
  if (String(db.users[login]).startsWith("social:")) { ui.pwdMsg = "Пароль не задан: вход через Google или Apple"; return render(); }
  if (db.users[login] !== await hash(login + ":" + f.old.value)) { ui.pwdMsg = "Текущий пароль неверный"; return render(); }
  if (f.nw.value.length < 6) { ui.pwdMsg = "Новый пароль: минимум 6 символов"; return render(); }
  db.users[login] = await hash(login + ":" + f.nw.value); ui.pwdMsg = ""; save(); render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
  if (a === "mode") { ui.mode = ui.mode === "reg" ? "login" : "reg"; ui.err = ""; return render(); }
  if (a === "social") {
    const login = v + "-profile";
    if (!db.data[login]) { db.users[login] = "social:" + v; db.data[login] = { notes: { study: "", sport: "" }, plans: [] }; }
    db.session = login; ui.tab = "today"; save(); return render();
  }
  if (a === "tab") { ui.tab = v; ui.sheet = null; ui.notify = false; return render(); }
  if (a === "openadd") { ui.sheet = { date: v || todayStr(), cat: t.dataset.cat || null }; return render(); }
  if (a === "notify") { ui.notify = true; return render(); }
  if (a === "closenotify") { ui.notify = false; return render(); }
  if (a === "closesheet") { ui.sheet = null; return render(); }
  if (a === "pickday") { ui.anchor = v; return render(); }
  if (a === "month") {
    let m = ui.calMonth.m + Number(v), y = ui.calMonth.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    ui.calMonth = { y, m }; return render();
  }
  if (a === "cardbg") { prof().cardPreset = v; save(); return render(); }
  if (a === "pickcardbg") { const f = document.getElementById("cbf"); if (f) f.click(); return; }
  if (a === "pickavatar") { const f = document.getElementById("avf"); if (f) f.click(); return; }
  if (a === "removeavatar") { delete prof().avatar; save(); return render(); }
  if (a === "editprofile") { ui.editProfile = !ui.editProfile; return render(); }
  if (a === "accent") {
    const need = ACCENT_LEVELS[ACCENTS.indexOf(v)] ?? 1;
    if (levelFromXp(totalXp(me().plans, todayStr())) < need) { ui.colorMsg = "Этот цвет откроется на уровне " + need + ". Сейчас уровень " + accentLevel() + "."; return render(); }
    prof().accent = v; ui.colorMsg = ""; save(); return render();
  }
  if (a === "theme") { prof().theme = v; try { localStorage.setItem(KEY + "-theme", v); } catch (er) {} save(); return render(); }
  if (a === "asst-open") { ui.asst = asstNew("life"); ui.assistant = true; return render(); }
  if (a === "asst-close") { ui.assistant = false; return render(); }
  if (a === "asst-cat") { ui.asst.cat = v; return render(); }
  if (a === "asst-yes") { ui.asst.msgs.push({ from: "bot", text: `Отлично! Записано задач: ${ui.asst.count}.` }); ui.asst.stage = "done"; return render(); }
  if (a === "asst-no") { ui.asst.msgs.push({ from: "bot", text: "Слушаю, что ещё?" }); ui.asst.stage = "more"; return render(); }
  if (a === "asst-reset") { ui.asst = asstNew(ui.asst.cat); return render(); }
  if (a === "asst-mic") {
    if (dict) { dict.start().catch(() => {}); return; }
    ui.asst.msgs.push({ from: "bot", text: "Диктовка в приложении здесь недоступна. Нажми микрофон на клавиатуре." });
    return render();
  }
  if (a === "toggle-notify") {
    const p = prof(); p.notify = !p.notify; save();
    if (p.notify && window.Notification && Notification.permission === "default") Notification.requestPermission();
    return render();
  }
  if (a === "ssec") { ui.studySection = v; ui.studyForm = null; ui.studyMsg = ""; return render(); }
  if (a === "sform") { ui.studyForm = ui.studyForm === v ? null : v; ui.studyMsg = ""; return render(); }
  if (a === "inst") { studyOf().institution = v; ui.studyMsg = ""; save(); return render(); }
  if (a === "inst-reset") { studyOf().institution = null; save(); return render(); }
  if (a === "second") { const s = studyOf(); s.secondYear = !s.secondYear; save(); return render(); }
  if (a === "fail") {
    const sub = studyOf().subjects.find((x) => x.id === id);
    if (sub) { sub.failedAttempts = (sub.failedAttempts || 0) + 1; save(); }
    return render();
  }
  if (a === "card-show") { ui.cardShown = id; return render(); }
  if (a === "card-good" || a === "card-bad") {
    const s = studyOf();
    const i = s.cards.findIndex((c) => c.id === id);
    if (i >= 0) s.cards[i] = reviewCard(s.cards[i], a === "card-good", todayStr());
    ui.cardShown = null; save(); return render();
  }
  if (a === "pomo-start") { ui.pomoStart = Date.now(); startPomoTicker(); return render(); }
  if (a === "pomo-skip") {
    if (ui.pomoStart) { ui.pomoStart = skipPomodoro(ui.pomoStart, Date.now()); startPomoTicker(); }
    return render();
  }
  if (a === "pomo-stop") {
    ui.pomoStart = null;
    if (pomoTicker) { clearInterval(pomoTicker); pomoTicker = null; }
    return render();
  }
  if (a === "habit") {
    const h = habitsOf().find((x) => x.id === id);
    if (h) { h.doneDays = toggleDay(h.doneDays, todayStr()); save(); render(); }
    return;
  }
  if (a === "rest-skip") {
    if (ui.rest) { ui.rest = skipRest(ui.rest, Date.now()); render(); }
    return;
  }
  if (a === "toggle-game") { const p = prof(); p.game = p.game === false; save(); return render(); }
  if (a === "toggle-stats") { const p = prof(); p.showStats = !p.showStats; save(); return render(); }
  if (a === "goal") { const p = prof(); p.goal = Math.max(1, Math.min(20, p.goal + Number(v))); save(); return render(); }
  if (a === "toggle") { const p = me().plans.find(x => x.id === id); if (p) { p.done = !p.done; save(); render(); } return; }
  if (a === "del") { me().plans = me().plans.filter(x => x.id !== id); save(); return render(); }
  if (a === "logout") { db.session = null; ui.tab = "today"; save(); return render(); }
  if (a === "switch") { db.session = v; ui.tab = "today"; save(); return render(); }
  if (a === "addaccount") { db.session = null; ui.mode = "reg"; ui.err = ""; return render(); }
  if (a === "export") {
    const text = buildExport(db.session, me(), new Date().toISOString());
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "maestro-" + db.session + ".json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  if (a === "import-pick") { const f = document.getElementById("impf"); if (f) f.click(); return; }
  if (a === "wipe") {
    if (ui.confirm !== "wipe") { ui.confirm = "wipe"; return render(); }
    me().plans = []; me().notes = { study: "", sport: "" }; ui.confirm = ""; save(); return render();
  }
  if (a === "delete") {
    if (ui.confirm !== "delete") { ui.confirm = "delete"; return render(); }
    const l = db.session; delete db.users[l]; delete db.data[l]; db.session = null; ui.confirm = ""; save(); return render();
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "auth") return doAuth(f);
  if (f.id === "pwd") return changePassword(f);
  if (f.id === "asst") { asstSend(f.text.value); return render(); }
  if (f.id === "wk") { addSet(f); return; }
  if (["subj", "asm", "att", "dl", "les", "card"].includes(f.id) && !ui.studyMsg) ui.studyForm = null;
  if (f.id === "subj") { studyOf().subjects.push({ id: uid(), name: f.name.value.trim(), failedAttempts: 0 }); save(); return render(); }
  if (f.id === "asm") {
    const s = studyOf();
    const v = Number(f.value.value);
    const lo = s.institution === "school" ? 2 : 0, hi = s.institution === "school" ? 5 : 100;
    if (!(v >= lo && v <= hi)) { ui.studyMsg = "Значение должно быть от " + lo + " до " + hi; return render(); }
    if (s.institution === "college") {
      const sum = s.assessments.filter((a) => a.subjectId === f.sub.value).reduce((t, a) => t + a.value, 0) + v;
      if (sum > 100) { ui.studyMsg = "Сумма баллов по предмету не больше 100"; return render(); }
    }
    s.assessments.push({ id: uid(), subjectId: f.sub.value, kind: f.kind.value, value: v, date: todayStr() });
    ui.studyMsg = ""; save(); return render();
  }
  if (f.id === "att") { studyOf().attendance = Math.min(100, Math.max(0, Number(f.pct.value) || 0)); save(); return render(); }
  if (f.id === "dl") { studyOf().deadlines.push({ id: uid(), title: f.title.value.trim(), due: f.due.value }); save(); return render(); }
  if (f.id === "les") {
    studyOf().lessons.push({ id: uid(), weekday: Number(f.wd.value), start: f.start.value, end: f.end.value, subject: f.subject.value.trim() });
    save(); return render();
  }
  if (f.id === "card") { studyOf().cards.push({ id: uid(), front: f.front.value.trim(), back: f.back.value.trim(), box: 0, due: todayStr() }); save(); return render(); }
  if (f.id === "profile") { const p = prof(); p.name = f.name.value.trim(); p.bio = f.bio.value.trim(); ui.editProfile = false; save(); return render(); }
  if (f.id === "add") {
    const text = f.text.value.trim();
    if (!text) return;
    const cat = f.dataset.cat === "plan" ? f.cat.value : f.dataset.cat;
    const date = f.date.value || todayStr();
    me().plans.push({ id: uid(), cat, text, date, time: f.time.value || "", done: false });
    ui.anchor = date; ui.sheet = null; save(); render();
  }
});

document.addEventListener("change", e => {
  if (e.target.id !== "avf" || !db.session) return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 200, c = document.createElement("canvas");
      c.width = size; c.height = size;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      prof().avatar = c.toDataURL("image/jpeg", 0.85);
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

document.addEventListener("change", e => {
  if (e.target.id !== "cbf" || !db.session) return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      prof().cardPhoto = c.toDataURL("image/jpeg", 0.8);
      prof().cardPreset = "photo";
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

document.addEventListener("change", e => {
  if (e.target.id !== "impf" || !db.session) return;
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  file.text().then(text => {
    const { result, user } = mergeImport(text, me());
    if (result.ok) {
      db.data[db.session] = user;
      save();
      ui.importMsg = "Импорт: добавлено " + result.added + ", пропущено " + result.skipped + (result.notesFilled ? ", заметки дополнены" : "");
    } else {
      ui.importMsg = result.error;
    }
    render();
  });
});

document.addEventListener("change", e => {
  if (e.target.matches && e.target.matches("[data-ex]")) { ui.exercise = e.target.value; render(); }
});

document.addEventListener("input", e => {
  const d = e.target.dataset || {};
  if (d.note && db.session) { me().notes[d.note] = e.target.value; save(); }
  if (d.set && db.session) { prof()[d.set] = e.target.value; save(); }
});

if (window.matchMedia) {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", () => { if (db.session) render(); });
}

function checkReminders(){
  if (!db.session || !db.data[db.session]) return;
  const p = prof();
  if (!p.notify) return;
  const { due, notified } = dueReminders(me().plans, nowParts(new Date()), p.notified || []);
  p.notified = [...notified];
  for (const x of due) {
    if (window.Notification && Notification.permission === "granted") {
      new Notification("Задачник Маэстро", { body: x.text + " \u00b7 " + x.time });
    }
  }
  save();
}

setInterval(checkReminders, 30000);
render();
checkReminders();
})();
</script>
</body>
</html>
