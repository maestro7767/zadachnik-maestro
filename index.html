<style>
:root{--accent:#ff5a36;--green:#34c759;--red:#ff453a}
:root[data-eff="dark"]{--bg:#0a0a0f;--card:#16161d;--fg:#ffffff;--mute:#8e8e99;--line:rgba(255,255,255,.08);--field:#1e1e27;color-scheme:dark}
:root[data-eff="light"]{--bg:#f3f3f7;--card:#ffffff;--fg:#111116;--mute:#77777f;--line:rgba(0,0,0,.08);--field:#ececf2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--fg)}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 94%,var(--accent)) 100%);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
input,textarea,select{width:100%;background:var(--field);border:none;border-radius:14px;padding:14px;font-size:17px;outline:none}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}

label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 8px;max-width:520px;margin:0 auto}
.title{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.pill{background:var(--card);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;color:var(--accent)}
.plus{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}

.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.task.done .check{background:var(--green);border-color:var(--green)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--field);color:var(--fg)}

.label{font-size:13px;color:var(--mute);font-weight:600;margin:20px 4px 0;text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--mute);text-align:center;padding:20px 12px;background:var(--card);border-radius:18px;margin-top:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--field);border-radius:14px;padding:4px;gap:4px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>label{min-width:0}
input[type="date"],input[type="time"]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block}
.auth{max-width:420px;margin:0 auto;padding:28px 18px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.social{width:100%;border-radius:14px;padding:14px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;background:#fff;color:#111}
.social.apple{background:#000;color:#fff}
.social svg{width:20px;height:20px}
.mini{font-size:13px;color:var(--mute)}
.hellobtn{display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;text-align:left;min-height:0}
.hellobtn:hover{background:none}
.wchart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:130px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.wbar{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--field);border-radius:10px;overflow:hidden}

.logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#1c1c26,#302450);color:#ff5a36;font-size:50px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 12px 32px rgba(255,90,54,.28)}
.feat b{display:block;font-size:15px}
.feat small{color:var(--mute);font-size:13px}
.tabs{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--card) 82%,transparent)}
.cicon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;background:color-mix(in srgb,var(--c) 22%,transparent);flex:0 0 auto;margin-top:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page.fresh{animation:fadeUp .3s ease backwards}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto;margin:12px 0;padding:4px 0}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.35;word-break:break-word}
.msg.bot{background:var(--field);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{padding:8px 14px;border-radius:999px;background:var(--field);font-size:14px;font-weight:600;min-height:0}
.chip-btn.on{background:var(--accent);color:#fff}
.avwrap{position:relative;width:88px;margin:0 auto 10px}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avcam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.strip .day{flex-direction:column;padding:10px 0;border-radius:14px;background:var(--card);color:var(--fg);min-height:64px;gap:2px;display:flex;align-items:center;justify-content:center}
.strip .day small{font-size:12px;color:var(--mute)}
.strip .day b{font-size:18px}
.strip .day.on{background:var(--accent);color:#fff}
.strip .day.on small{color:#fff}
.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 75%,#fff) 0%,var(--accent) 100%);color:#fff}
.hero .mini{color:rgba(255,255,255,.85)}
.hero .bar{background:rgba(255,255,255,.3)}
.hero .bar i{background:#fff}

/* Визуальный слой: анимации и оформление */
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.task .check{transition:background .25s,border-color .25s,transform .2s}
.task.done .check{animation:pop .35s ease}
.task .t{transition:color .3s,opacity .3s}
.task.done .t{opacity:.55}
button{transition:transform .12s ease,background .2s,color .2s,box-shadow .2s}
button:active{transform:scale(.96)}
.task{transition:transform .15s ease}
.task:active{transform:scale(.985)}
.head{background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%);transition:background .5s ease}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadeIn .4s ease both}
.empty::before{content:"\2726";font-size:26px;color:var(--accent)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;background:var(--line);border-radius:2px}
.tl>.task{overflow:visible}
.tl>.task::after{content:"";position:absolute;left:-19px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px var(--bg)}
.tl>.task.done::after{opacity:.4}
.colors button.locked{opacity:.35;font-size:14px;display:flex;align-items:center;justify-content:center}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.pomo-time{font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips-row .chip-btn{flex:1 1 auto;text-align:center}
.sub-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tabs .chip-btn{flex:0 0 auto;white-space:nowrap;padding:10px 18px;font-size:15px}
</style>

<body>
<div id="app"></div>
<script type="module">
import { pad, ymd, addDays } from "./src/core/date.ts";
import { loadAppData, saveAppData } from "./src/data/storage.ts";
import { dueReminders, nowParts } from "./src/notifications/reminders.ts";
import { buildExport, mergeImport } from "./src/data/transfer.ts";
import { totalXp } from "./src/gamification/total.ts";
import { dailyChallenges, evaluateChallenge } from "./src/gamification/challenges.ts";
import { levelFromXp, progressToNext } from "./src/gamification/xp.ts";
import { rewardsEarned, streakWithFreeze } from "./src/gamification/streaks.ts";
import { toggleDay, habitStreak } from "./src/habits/habits.ts";
import { starterHabits } from "./src/habits/starter.ts";
import { DEFAULT_EXERCISES, isValidSet, exerciseProgress } from "./src/sport/workouts.ts";
import { remainingSec, formatTime, skipRest } from "./src/sport/restTimer.ts";
import { emptyStudy } from "./src/study/model.ts";
import { lessonsOn } from "./src/study/lessons.ts";
import { daysLeft, upcomingDeadlines } from "./src/study/deadlines.ts";
import { pomodoroAt, skipPomodoro } from "./src/study/pomodoro.ts";
import { reviewCard, dueCards } from "./src/study/flashcards.ts";
import { subjectResultView } from "./src/study/journal.ts";
import { parseWhen } from "./src/assistant/parse.ts";
import { createApi, ApiError } from "./src/sync/api.ts";
import { SyncEngine } from "./src/sync/engine.ts";
import { applyRemoteChanges } from "./src/sync/merge.ts";

const ACCENT_LEVELS = [1, 2, 3, 4, 5, 6, 7];
(function(){
"use strict";

const KEY = "zadachnik-v1";
const CATS = { study: { name: "Учёба", c: "#8b6cf0" }, sport: { name: "Спорт", c: "#34c759" }, life: { name: "Быт", c: "#ff9f0a" } };
const ACCENTS = ["#ff5a36", "#5f4bff", "#ff375f", "#34c759", "#ff9f0a", "#0a84ff", "#64d2ff"];
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MONTHS = ["Января","Февраля","Марта","Апреля","Мая","Июня","Июля","Августа","Сентября","Октября","Ноября","Декабря"];

// Диктовка помощника: Web Speech API, где доступно. dict === null там, где API нет.
const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
let dict = null;
if (SpeechRecognitionApi) {
  dict = new SpeechRecognitionApi();
  dict.lang = "ru-RU";
  dict.interimResults = false;
  dict.maxAlternatives = 1;
  dict.addEventListener("result", (e) => {
    const text = e.results[0] && e.results[0][0] ? e.results[0][0].transcript : "";
    const input = document.getElementById("asstInput");
    if (input && text) input.value = text;
  });
}

let db = { users: {}, data: {}, session: null };
db = loadAppData(localStorage, KEY);

const ui = { tab: "today", anchor: "", calMonth: null, mode: "login", err: "", sheet: null, editProfile: false, pwdMsg: "", confirm: "", cloudAuth: true, busy: false, syncStatus: "ok", migrate: null };

function todayStr(){ return ymd(new Date()); }
function nowIso(){ return new Date().toISOString(); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function persist(){ try { saveAppData(localStorage, KEY, db); } catch (e) {} }
function save(){ persist(); if (sync && cloud && db.session === cloud.email) sync.notifyLocal(me()); }
function me(){ return db.data[db.session]; }

/* --- Облачная синхронизация --- */
const SERVER_URL = (() => { try { return localStorage.getItem(KEY + "-server") || "https://maestro-server.fly.dev"; } catch (e) { return "https://maestro-server.fly.dev"; } })();
const api = createApi(SERVER_URL, fetch);

function loadCloud(){ try { const raw = localStorage.getItem(KEY + "-cloud"); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveCloud(c){ try { if (c) localStorage.setItem(KEY + "-cloud", JSON.stringify(c)); else localStorage.removeItem(KEY + "-cloud"); } catch (e) {} }
let cloud = loadCloud();
let sync = null;

function isCloudSession(){ return !!(cloud && db.session === cloud.email); }

function cloudErrorText(e){
  if (!(e instanceof ApiError)) return "Сервер недоступен. Проверь интернет и попробуй снова.";
  return ({
    email_taken: "Такой email уже зарегистрирован",
    invalid_credentials: "Неверный email или пароль",
    weak_password: "Пароль: от 8 до 128 символов",
    invalid_email: "Проверь email",
    rate_limited: "Слишком много попыток. Подожди 10 минут",
  })[e.code] || "Ошибка сервера: " + e.code;
}

function syncStatusText(){
  const s = ui.syncStatus || "ok";
  return { ok: "Синхронизировано ✓", syncing: "Синхронизация…", offline: "Нет связи — правки сохранены локально", unauthorized: "Требуется повторный вход" }[s] || s;
}

function cloudLogout(msg){
  if (cloud) api.logout(cloud.refreshToken).catch(() => {});
  if (sync) { sync.stop(); sync = null; }
  cloud = null; saveCloud(null);
  if (isCloudSession() || (db.session && db.session.includes("@"))) db.session = null;
  if (msg) ui.err = msg;
  persist(); render();
}

function startSync(){
  if (!isCloudSession()) return;
  if (sync) sync.stop();
  sync = new SyncEngine({
    api, store: localStorage, storageKey: KEY + "-sync-" + cloud.email, session: cloud,
    onRemote: (changes) => {
      if (!isCloudSession()) return;
      const changed = applyRemoteChanges(me(), changes);
      sync.noteSnapshot(me()); // сначала снимок, чтобы правки не уехали обратно как локальные
      if (changed) { persist(); render(); }
    },
    onStatus: (s) => { ui.syncStatus = s; if (isCloudSession()) render(); },
    onSession: (s) => { cloud = s; saveCloud(cloud); },
    onAuthLost: () => cloudLogout("Сессия истекла. Войди снова."),
  });
  (async () => {
    try {
      if (sync.needsInitialPull()) {
        const n = await sync.initialPull();
        if (n === 0) offerMigration();
      } else {
        await sync.syncNow();
      }
      if (isCloudSession()) sync.noteSnapshot(me());
    } catch (e) { /* нет сети — движок сам планирует повторы */ }
  })();
}

/** Первый вход на пустой сервер: предлагаем перенести локальный аккаунт в облако. */
function offerMigration(){
  const locals = Object.keys(db.data).filter(n => n !== db.session && !n.includes("@") && !n.endsWith("-profile"));
  if (locals.length > 0) { ui.migrate = locals; render(); }
}

function migrateHTML(){
  return `<div class="sheet-bg" data-act="migrate-skip"></div><div class="sheet"><div class="grab"></div>
    <div class="title" style="font-size:22px;margin-bottom:8px">Перенести данные в облако?</div>
    <div class="sub" style="margin-bottom:14px">На сервере пусто. На этом устройстве есть локальные аккаунты — выбери, чьи планы и заметки загрузить в облако.</div>

async function hash(s){
  if (window.crypto && crypto.subtle) {
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return "x" + h;
}

function applyTheme(){
  const loggedIn = db.session && db.data[db.session];
  const pref = loggedIn ? prof().theme : (localStorage.getItem(KEY + "-theme") || "dark");
  const sysDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  const eff = pref === "system" ? (sysDark ? "dark" : "light") : pref;
  document.documentElement.dataset.eff = eff === "light" ? "light" : "dark";
  document.documentElement.style.setProperty("--accent", loggedIn ? prof().accent : ACCENTS[0]);
}

function weekChartHTML(){

  const monday = addDays(ui.anchor, -selIdx);
  const counts = [];
  for (let i = 0; i < 7; i++) counts.push(me().plans.filter(x => x.date === addDays(monday, i) && x.done && !x.deletedAt).length);
  const max = Math.max(1, ...counts);
  const bars = counts.map((n, i) => `<div class="wcol ${i === selIdx ? "now" : ""}"><div class="wbar"><i style="height:${Math.max(6, Math.round(n / max * 100))}%"></i></div><small>${WDS[i]}</small></div>`).join("");
  return `<div class="label">Неделя</div><div class="card"><div class="wchart">${bars}</div></div>`;

function calendarView(){
  const { y, m } = ui.calMonth;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const daysIn = new Date(y, m + 1, 0).getDate();
  const plans = me().plans;
  let cells = "";
  for (let i = 0; i < offset; i++) cells += `<span></span>`;
  for (let d = 1; d <= daysIn; d++) {
    const s = y + "-" + pad(m + 1) + "-" + pad(d);
    const has = plans.some(x => x.date === s && !x.deletedAt);
    const cls = (s === ui.anchor ? "sel " : "") + (s === todayStr() ? "today" : "");
    cells += `<button data-act="pickday" data-v="${s}" class="${cls}">${d}${has ? `<span class="dot"></span>` : ""}</button>`;
  }
  const day = plans.filter(x => x.date === ui.anchor && !x.deletedAt);
  // Агенда на неделю вперёд: заполняет экран и сразу видно, что запланировано.
  const agendaRows = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(ui.anchor, i);
    const items = plans.filter(x => x.date === d && !x.deletedAt);
    if (items.length === 0) continue;
    agendaRows.push(`<div class="mini" style="margin:12px 4px 2px">${fmtLong(d)}</div>` + items.map(taskHTML).join(""));
  }
  return `
  <div class="head"><div class="title">Календарь</div><button class="plus" data-act="openadd" data-v="${ui.anchor}">+</button></div>
  <div class="wrap">
    <div class="card">

      <div class="cal">${WD.map(w => `<span class="wd">${w}</span>`).join("")}${cells}</div>
    </div>
    <div class="label">${fmtLong(ui.anchor)}</div>
    ${dayList(day)}
    <div class="label">Ближайшие 7 дней</div>
    ${agendaRows.length ? `<div class="tl">${agendaRows.join("")}</div>` : `<div class="empty">На неделю вперёд ничего не запланировано. Нажми +, чтобы добавить план</div>`}
  </div>`;
}

function dayLabel(d){
  if (d === todayStr()) return "сегодня";
  if (d === addDays(todayStr(), 1)) return "завтра";
  const x = new Date(d + "T00:00");
  return pad(x.getDate()) + "." + pad(x.getMonth() + 1);
}

function asstSend(text){
  const a = ui.asst, t = (text || "").trim();
  if (!a || !t || a.stage === "done") return;
  const r = parseWhen(t, todayStr());
  me().plans.push({ id: uid(), cat: a.cat, text: r.text || t, date: r.date, time: r.time, done: false, updatedAt: nowIso(), deletedAt: null });
  ui.anchor = r.date;
  save();
  a.count++;
  a.msgs.push({ from: "me", text: t });
  a.msgs.push({ from: "bot", text: `${a.stage === "more" ? "Записал" : "Готово"}: ${dayLabel(r.date)}${r.time ? ", " + r.time : ""}. Это все?` });

async function doAuth(f){
  const login = f.login.value.trim().toLowerCase(), pass = f.pass.value;
  if (!/^[a-z0-9_.\-]{3,20}$/.test(login)) { ui.err = "Логин: 3–20 символов, латиница, цифры, . _ -"; return render(); }
  if (pass.length < 6) { ui.err = "Пароль: минимум 6 символов"; return render(); }
  const h = await hash(login + ":" + pass);
  if (ui.mode === "reg") {
    if (db.users[login]) { ui.err = "Такой логин уже занят"; return render(); }
    db.users[login] = h; db.data[login] = { notes: { study: "", sport: "" }, plans: [] };
  } else if (db.users[login] !== h) { ui.err = "Неверный логин или пароль"; return render(); }
  db.session = login; ui.err = ""; ui.tab = "today"; save(); render();
}

async function doCloudAuth(f){
  const email = f.email.value.trim().toLowerCase(), pass = f.pass.value;
  const nick = ui.mode === "reg" ? f.nick.value.trim() : "";
  if (ui.mode === "reg" && (nick.length < 2 || nick.length > 30)) { ui.err = "Ник: 2–30 символов"; return render(); }
  if (pass.length < 8 || pass.length > 128) { ui.err = "Пароль: от 8 до 128 символов"; return render(); }
  ui.err = ""; ui.busy = true; render();
  try {
    const res = ui.mode === "reg" ? await api.register(email, pass, nick) : await api.login(email, pass);
    cloud = { email, accessToken: res.accessToken, refreshToken: res.refreshToken, accessExpiresAt: res.accessExpiresAt };
    saveCloud(cloud);
    if (!db.users[email]) db.users[email] = "cloud:";
    if (!db.data[email]) db.data[email] = { notes: { study: "", sport: "" }, plans: [] };
    const serverName = res.name || nick;
    db.session = email; ui.tab = "today"; ui.busy = false; ui.mode = "login";
    if (serverName && !prof().name) { prof().name = serverName; prof().updatedAt = nowIso(); }
    persist(); render();
    startSync();
  } catch (e) {
    ui.busy = false; ui.err = cloudErrorText(e); render();
  }
}

async function changePassword(f){
  const login = db.session;
  if (String(db.users[login]).startsWith("social:")) { ui.pwdMsg = "Пароль не задан: вход через Google или Apple"; return render(); }
  if (String(db.users[login]).startsWith("cloud:")) { ui.pwdMsg = "Смена пароля облачного аккаунта появится вместе с подтверждением email"; return render(); }
  if (db.users[login] !== await hash(login + ":" + f.old.value)) { ui.pwdMsg = "Текущий пароль неверный"; return render(); }
  if (f.nw.value.length < 6) { ui.pwdMsg = "Новый пароль: минимум 6 символов"; return render(); }
  db.users[login] = await hash(login + ":" + f.nw.value); ui.pwdMsg = ""; save(); render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
  if (a === "mode") { ui.mode = ui.mode === "reg" ? "login" : "reg"; ui.err = ""; return render(); }
  if (a === "toggleauth") { ui.cloudAuth = !ui.cloudAuth; ui.err = ""; return render(); }
  if (a === "syncnow") { if (sync) void sync.syncNow(); return; }
  if (a === "migrate") {
    const src = db.data[v];
    if (src && isCloudSession()) {
      db.data[db.session] = JSON.parse(JSON.stringify(src));
      persist();
      if (sync) { sync.uploadAll(me()); }
    }
    ui.migrate = null; return render();
  }
  if (a === "migrate-skip") { ui.migrate = null; return render(); }
  if (a === "social") {
    const login = v + "-profile";
    if (!db.data[login]) { db.users[login] = "social:" + v; db.data[login] = { notes: { study: "", sport: "" }, plans: [] }; }
    db.session = login; ui.tab = "today"; save(); return render();
  }
  if (a === "tab") { ui.tab = v; ui.sheet = null; ui.notify = false; return render(); }
  if (a === "openadd") { ui.sheet = { date: v || todayStr(), cat: t.dataset.cat || null }; return render(); }
  if (a === "notify") { ui.notify = true; return render(); }
  if (a === "closenotify") { ui.notify = false; return render(); }
  if (a === "closesheet") { ui.sheet = null; return render(); }
  if (a === "pickday") { ui.anchor = v; return render(); }
  if (a === "month") {
    let m = ui.calMonth.m + Number(v), y = ui.calMonth.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    ui.calMonth = { y, m }; return render();
  }
  if (a === "cardbg") { const p = prof(); p.cardPreset = v; p.updatedAt = nowIso(); save(); return render(); }
  if (a === "pickcardbg") { const f = document.getElementById("cbf"); if (f) f.click(); return; }
  if (a === "pickavatar") { const f = document.getElementById("avf"); if (f) f.click(); return; }
  if (a === "removeavatar") { const p = prof(); delete p.avatar; p.updatedAt = nowIso(); save(); return render(); }
  if (a === "editprofile") { ui.editProfile = !ui.editProfile; return render(); }
  if (a === "accent") {
    const need = ACCENT_LEVELS[ACCENTS.indexOf(v)] ?? 1;
    if (levelFromXp(totalXp(me().plans, todayStr())) < need) { ui.colorMsg = "Этот цвет откроется на уровне " + need + ". Сейчас уровень " + accentLevel() + "."; return render(); }
    const p2 = prof(); p2.accent = v; p2.updatedAt = nowIso(); ui.colorMsg = ""; save(); return render();
  }
  if (a === "theme") { const p = prof(); p.theme = v; p.updatedAt = nowIso(); try { localStorage.setItem(KEY + "-theme", v); } catch (er) {} save(); return render(); }
  if (a === "asst-open") { ui.asst = asstNew("life"); ui.assistant = true; return render(); }
  if (a === "asst-close") { ui.assistant = false; return render(); }
  if (a === "asst-cat") { ui.asst.cat = v; return render(); }
  if (a === "asst-yes") { ui.asst.msgs.push({ from: "bot", text: `Отлично! Записано задач: ${ui.asst.count}.` }); ui.asst.stage = "done"; return render(); }
  if (a === "asst-no") { ui.asst.msgs.push({ from: "bot", text: "Слушаю, что ещё?" }); ui.asst.stage = "more"; return render(); }
  if (a === "asst-reset") { ui.asst = asstNew(ui.asst.cat); return render(); }
  if (a === "asst-mic") {
    if (dict) { try { dict.start(); } catch (err) { /* уже слушает */ } return; }
    ui.asst.msgs.push({ from: "bot", text: "Диктовка в приложении здесь недоступна. Нажми микрофон на клавиатуре." });
    return render();
  }
  if (a === "toggle-notify") {
    const p = prof(); p.notify = !p.notify; p.updatedAt = nowIso(); save();
    if (p.notify && window.Notification && Notification.permission === "default") Notification.requestPermission();
    return render();
  }
  if (a === "ssec") { ui.studySection = v; ui.studyForm = null; ui.studyMsg = ""; return render(); }
  if (a === "sform") { ui.studyForm = ui.studyForm === v ? null : v; ui.studyMsg = ""; return render(); }
  if (a === "inst") { const s = studyOf(); s.institution = v; s.updatedAt = nowIso(); ui.studyMsg = ""; save(); return render(); }
  if (a === "inst-reset") { const s = studyOf(); s.institution = null; s.updatedAt = nowIso(); save(); return render(); }
  if (a === "second") { const s = studyOf(); s.secondYear = !s.secondYear; s.updatedAt = nowIso(); save(); return render(); }
  if (a === "fail") {
    const sub = studyOf().subjects.find((x) => x.id === id);
    if (sub) { sub.failedAttempts = (sub.failedAttempts || 0) + 1; sub.updatedAt = nowIso(); save(); }
    return render();
  }
  if (a === "card-show") { ui.cardShown = id; return render(); }
  if (a === "card-good" || a === "card-bad") {
    const s = studyOf();
    const i = s.cards.findIndex((c) => c.id === id);
    if (i >= 0) s.cards[i] = { ...reviewCard(s.cards[i], a === "card-good", todayStr()), updatedAt: nowIso() };
    ui.cardShown = null; save(); return render();
  }
  if (a === "pomo-start") { ui.pomoStart = Date.now(); startPomoTicker(); return render(); }
  if (a === "pomo-skip") {
    if (ui.pomoStart) { ui.pomoStart = skipPomodoro(ui.pomoStart, Date.now()); startPomoTicker(); }
    return render();
  }
  if (a === "pomo-stop") {
    ui.pomoStart = null;
    if (pomoTicker) { clearInterval(pomoTicker); pomoTicker = null; }
    return render();
  }
  if (a === "habit") {
    const h = habitsOf().find((x) => x.id === id);
    if (h) { h.doneDays = toggleDay(h.doneDays, todayStr()); h.updatedAt = nowIso(); save(); render(); }
    return;
  }
  if (a === "rest-skip") {
    if (ui.rest) { ui.rest = skipRest(ui.rest, Date.now()); render(); }
    return;
  }
  if (a === "toggle-game") { const p = prof(); p.game = p.game === false; p.updatedAt = nowIso(); save(); return render(); }
  if (a === "toggle-stats") { const p = prof(); p.showStats = !p.showStats; p.updatedAt = nowIso(); save(); return render(); }
  if (a === "goal") { const p = prof(); p.goal = Math.max(1, Math.min(20, p.goal + Number(v))); p.updatedAt = nowIso(); save(); return render(); }
  if (a === "toggle") { const p = me().plans.find(x => x.id === id); if (p) { p.done = !p.done; p.updatedAt = nowIso(); save(); render(); } return; }
  if (a === "del") { const p = me().plans.find(x => x.id === id); if (p) { p.deletedAt = nowIso(); p.updatedAt = p.deletedAt; } save(); return render(); }
  if (a === "logout") {
    if (isCloudSession()) { cloudLogout(); return; }
    db.session = null; ui.tab = "today"; save(); return render();
  }
  if (a === "switch") {
    db.session = v; ui.tab = "today"; save();
    if (sync) { sync.stop(); sync = null; }
    if (isCloudSession()) startSync();
    return render();
  }
  if (a === "addaccount") { db.session = null; ui.mode = "reg"; ui.err = ""; return render(); }
  if (a === "export") {
    const text = buildExport(db.session, me(), new Date().toISOString());
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "maestro-" + db.session + ".json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  if (a === "import-pick") { const f = document.getElementById("impf"); if (f) f.click(); return; }
  if (a === "wipe") {
    if (ui.confirm !== "wipe") { ui.confirm = "wipe"; return render(); }
    const t = nowIso(); for (const p of me().plans) { if (!p.deletedAt) { p.deletedAt = t; p.updatedAt = t; } } me().notes = { study: "", sport: "", updatedAt: t }; ui.confirm = ""; save(); return render();
  }
  if (a === "delete") {
    if (ui.confirm !== "delete") { ui.confirm = "delete"; return render(); }
    const wasCloud = isCloudSession();
    const l = db.session; delete db.users[l]; delete db.data[l]; db.session = null; ui.confirm = "";
    if (wasCloud) { cloudLogout(); return; }
    save(); return render();
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "auth") return doAuth(f);
  if (f.id === "cloudauth") return doCloudAuth(f);
  if (f.id === "pwd") return changePassword(f);
  if (f.id === "asst") { asstSend(f.text.value); return render(); }
  if (f.id === "wk") { addSet(f); return; }
  if (["subj", "asm", "att", "dl", "les", "card"].includes(f.id) && !ui.studyMsg) ui.studyForm = null;
  if (f.id === "subj") { studyOf().subjects.push({ id: uid(), name: f.name.value.trim(), failedAttempts: 0, updatedAt: nowIso(), deletedAt: null }); save(); return render(); }
  if (f.id === "asm") {
    const s = studyOf();
    const v = Number(f.value.value);
    const lo = s.institution === "school" ? 2 : 0, hi = s.institution === "school" ? 5 : 100;
    if (!(v >= lo && v <= hi)) { ui.studyMsg = "Значение должно быть от " + lo + " до " + hi; return render(); }
    if (s.institution === "college") {
      const sum = s.assessments.filter((a) => a.subjectId === f.sub.value && !a.deletedAt).reduce((t, a) => t + a.value, 0) + v;
      if (sum > 100) { ui.studyMsg = "Сумма баллов по предмету не больше 100"; return render(); }
    }
    s.assessments.push({ id: uid(), subjectId: f.sub.value, kind: f.kind.value, value: v, date: todayStr(), updatedAt: nowIso(), deletedAt: null });
    ui.studyMsg = ""; save(); return render();
  }
  if (f.id === "att") { const s = studyOf(); s.attendance = Math.min(100, Math.max(0, Number(f.pct.value) || 0)); s.updatedAt = nowIso(); save(); return render(); }
  if (f.id === "dl") { studyOf().deadlines.push({ id: uid(), title: f.title.value.trim(), due: f.due.value, updatedAt: nowIso(), deletedAt: null }); save(); return render(); }
  if (f.id === "les") {
    studyOf().lessons.push({ id: uid(), weekday: Number(f.wd.value), start: f.start.value, end: f.end.value, subject: f.subject.value.trim(), updatedAt: nowIso(), deletedAt: null });
    save(); return render();
  }
  if (f.id === "card") { studyOf().cards.push({ id: uid(), front: f.front.value.trim(), back: f.back.value.trim(), box: 0, due: todayStr(), updatedAt: nowIso(), deletedAt: null }); save(); return render(); }
  if (f.id === "profile") { const p = prof(); p.name = f.name.value.trim(); p.bio = f.bio.value.trim(); p.updatedAt = nowIso(); ui.editProfile = false; save(); return render(); }
  if (f.id === "add") {
    const text = f.text.value.trim();
    if (!text) return;
    const cat = f.dataset.cat === "plan" ? f.cat.value : f.dataset.cat;
    const date = f.date.value || todayStr();
    me().plans.push({ id: uid(), cat, text, date, time: f.time.value || "", done: false, updatedAt: nowIso(), deletedAt: null });
    ui.anchor = date; ui.sheet = null; save(); render();
  }
});

document.addEventListener("change", e => {
  if (e.target.id !== "avf" || !db.session) return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 200, c = document.createElement("canvas");
      c.width = size; c.height = size;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      const p = prof(); p.avatar = c.toDataURL("image/jpeg", 0.85); p.updatedAt = nowIso();
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

document.addEventListener("change", e => {
  if (e.target.id !== "cbf" || !db.session) return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const p = prof(); p.cardPhoto = c.toDataURL("image/jpeg", 0.8); p.updatedAt = nowIso();
      prof().cardPreset = "photo";
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

document.addEventListener("change", e => {
  if (e.target.id !== "impf" || !db.session) return;
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  file.text().then(text => {
    const { result, user } = mergeImport(text, me());
    if (result.ok) {
      db.data[db.session] = user;
      save();
      ui.importMsg = "Импорт: добавлено " + result.added + ", пропущено " + result.skipped + (result.notesFilled ? ", заметки дополнены" : "");
    } else {
      ui.importMsg = result.error;
    }
    render();
  });
});

document.addEventListener("change", e => {
  if (e.target.matches && e.target.matches("[data-ex]")) { ui.exercise = e.target.value; render(); }
});

document.addEventListener("input", e => {
  const d = e.target.dataset || {};
  if (d.note && db.session) { me().notes[d.note] = e.target.value; me().notes.updatedAt = nowIso(); save(); }
  if (d.set && db.session) { const p = prof(); p[d.set] = e.target.value; p.updatedAt = nowIso(); save(); }
});

if (window.matchMedia) {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", () => { if (db.session) render(); });
}

function checkReminders(){
  if (!db.session || !db.data[db.session]) return;
  const p = prof();
  if (!p.notify) return;
  const { due, notified } = dueReminders(me().plans, nowParts(new Date()), p.notified || []);
  p.notified = [...notified];
  for (const x of due) {
    if (window.Notification && Notification.permission === "granted") {
      new Notification("Задачник Маэстро", { body: x.text + " \u00b7 " + x.time });
    }
  }
  save();
}

setInterval(checkReminders, 30000);
render();
checkReminders();
if (isCloudSession()) startSync();
})();
</script>
