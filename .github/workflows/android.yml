name: Android APK

# Собирает debug-APK при пуше в main. Артефакт можно скачать из вкладки Actions
# и поставить на телефон (нужно разрешить установку из неизвестных источников).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
